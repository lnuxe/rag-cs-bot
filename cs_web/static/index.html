<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无畏契约客服助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1923;
    --panel: #1a2733;
    --accent: #ff4655;
    --text: #ece8e1;
    --muted: #76879e;
    --user-bubble: #ff4655;
    --bot-bubble: #2a3a4a;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #ff4655 0%, #bd2231 100%);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,.4);
    z-index: 10;
  }
  header .logo {
    width: 42px; height: 42px;
    background: #0f1923;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; color: var(--accent);
  }
  header h1 { font-size: 20px; font-weight: 700; }
  header p { font-size: 12px; opacity: .85; margin-top: 2px; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,70,85,.06) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,70,85,.04) 0%, transparent 40%),
      var(--bg);
  }
  .msg { display: flex; gap: 10px; max-width: 80%; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
  .msg .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--user-bubble); }
  .msg.bot .avatar { background: var(--panel); border: 1px solid var(--accent); }
  .bubble {
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.7;
    font-size: 14.5px;
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .bubble img { max-width: 100%; border-radius: 8px; margin: 6px 0; display: block; }
  .bubble pre { background: #0f1923; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 6px 0; font-size: 13px; }
  .bubble table { border-collapse: collapse; margin: 6px 0; }
  .bubble td, .bubble th { border: 1px solid #4a5a6a; padding: 4px 8px; font-size: 13px; }
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; background: var(--muted);
    border-radius: 50%; animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2){ animation-delay: .2s; }
  .typing span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  footer {
    background: var(--panel);
    padding: 14px 20px;
    display: flex; gap: 10px; align-items: center;
    border-top: 1px solid #2a3a4a;
  }
  #input {
    flex: 1;
    background: var(--bg);
    border: 1px solid #2a3a4a;
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 14.5px;
    outline: none;
    resize: none;
    font-family: inherit;
    max-height: 120px;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  #send:hover { opacity: .85; }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; padding: 20px 0 0; }
  .quick {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 24px 0;
  }
  .quick button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2a3a4a;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }
  .quick button:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="logo">V</div>
  <div>
    <h1>无畏契约客服助手</h1>
    <p>AI 智能客服 · 基于知识库检索自动回复</p>
  </div>
</header>

<div class="quick" id="quick">
  <button data-q="新手推荐什么阵容组合？">新手阵容</button>
  <button data-q="鬼魅手枪多少钱？">武器价格</button>
  <button data-q="亚海悬城进攻怎么打？">地图战术</button>
  <button data-q="捷风有哪些技能？">特工技能</button>
</div>

<div id="chat">
  <div class="hint">你好！我是无畏契约客服助手，有什么可以帮你？<br>可以问我武器价格、地图战术、特工技能、阵容搭配等。</div>
</div>

<footer>
  <textarea id="input" rows="1" placeholder="输入你的问题... (Enter 发送)" oninput="autoGrow(this)"></textarea>
  <button id="send" onclick="sendMsg()">发送</button>
</footer>

<script>
let conversationId = "";

const $chat = document.getElementById("chat");
const $input = document.getElementById("input");
const $send = document.getElementById("send");

function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

function addMsg(text, who, isImg) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + who;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = who === "user" ? "我" : "AI";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (isImg) {
    // 渲染 Markdown 图片
    const m = text.match(/!\[[^\]]*\]\((https?:\/\/[^\s)]+)\)/);
    if (m) {
      const img = document.createElement("img");
      img.src = m[1];
      img.alt = "图片";
      bubble.appendChild(img);
      const desc = text.replace(/!\[[^\]]*\]\([^)]*\)/g, "").trim();
      if (desc) bubble.appendChild(document.createTextNode(desc));
    } else {
      bubble.textContent = text;
    }
  } else {
    // 简单 Markdown 链接渲染
    bubble.innerHTML = escapeHtml(text)
      .replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1">')
      .replace(/\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--accent)">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  $chat.appendChild(wrap);
  $chat.scrollTop = $chat.scrollHeight;
  return bubble;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function showTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg bot";
  wrap.id = "typing";
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "AI";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  wrap.appendChild(avatar);
  wrap.appendChild(bubble);
  $chat.appendChild(wrap);
  $chat.scrollTop = $chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

async function sendMsg() {
  const query = $input.value.trim();
  if (!query) return;
  addMsg(query, "user");
  $input.value = "";
  autoGrow($input);
  $send.disabled = true;
  showTyping();
  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, conversation_id: conversationId, user: "web-customer" })
    });
    const data = await resp.json();
    removeTyping();
    if (data.error) {
      addMsg("抱歉，" + data.error, "bot");
    } else {
      conversationId = data.conversation_id || conversationId;
      const isImg = /!\[[^\]]*\]\(https?:\/\/[^\s)]+\)/.test(data.answer);
      addMsg(data.answer, "bot", isImg);
    }
  } catch (e) {
    removeTyping();
    addMsg("网络连接失败，请检查服务是否运行。", "bot");
  } finally {
    $send.disabled = false;
    $input.focus();
  }
}

$input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
});

document.getElementById("quick").addEventListener("click", (e) => {
  if (e.target.tagName === "BUTTON") {
    $input.value = e.target.dataset.q;
    sendMsg();
  }
});

$input.focus();
</script>
</body>
</html>
